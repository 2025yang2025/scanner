name: Taiwan Stock Multi-Timeframe Scanner

on:
  # 1. 定時排程：週一至週五 台灣時間 14:40 (UTC 06:40) 執行
  schedule:
    # UTC 00:37 (08:37 TW), 01:47 (09:47 TW), 02:52 (10:52 TW), 03:47 (11:47 TW), 04:37 (12:37 TW), 07:33 (15:33 TW)
    - cron: '37 0,4 * * 1-5'
    - cron: '47 1,3 * * 1-5'
    - cron: '52 2 * * 1-5'
    - cron: '33 7 * * 1-5'

  # 2. 允許在 GitHub 網頁端手動點擊 "Run workflow" 測試
  workflow_dispatch:

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    # 設定最長執行時間為 15 分鐘，避免網路異常導致無限期卡住
    timeout-minutes: 15

    steps:
      - name: 📥 檢出程式碼 (Checkout Repository)
        uses: actions/checkout@v4

      - name: 🐍 設定 Python 環境與套件快取
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 安裝必要套件
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas yfinance requests
          fi

      - name: 🚀 執行台股多週期選股掃描 (含失敗重試)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TZ: Asia/Taipei
        run: |
          # 若第一次因 Yahoo Finance 網路波動失敗，等待 15 秒後自動重試一次
          python scanner.py || (echo "⚠️ 第一次執行異常，15秒後重試..." && sleep 15 && python scanner.py)

      - name: 🚨 執行失敗時發送 Telegram 異常通知
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="⚠️ <b>【台股選股排程異常】</b>%0AGitHub Actions 執行 <code>scanner.py</code> 失敗，請至 Actions 後台檢查 Log。"
