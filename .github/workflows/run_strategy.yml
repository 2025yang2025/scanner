name: Auto Stock Scanner

on:
  schedule:
    # 💡 換算：台灣時間 08:30 與 15:30 執行（週一到週五）
    - cron: '30 0,7 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
    # 1. 複製儲存庫程式碼
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 安裝 Python 環境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 安裝必要套件
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas yfinance requests lxml

    # 4. 執行選股腳本 (自動根據時間判斷要選股還是要發提醒)
    - name: Run Stock Scanner
      env:
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: python scanner.py

    # 5. 自動將結果提交回 GitHub 儲存庫 (確保 results.md 被更新)
    - name: Commit and Push results
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add results.md
        git commit -m "Auto-update stock selection results" || echo "No changes to commit"
        git push
