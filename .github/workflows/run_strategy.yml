name: Taiwan Market Multi-Strategy Monitor

on:
  schedule:
    # UTC 00:37 (08:37 TW), 01:47 (09:47 TW), 02:52 (10:52 TW), 03:47 (11:47 TW), 04:37 (12:37 TW), 07:33 (15:33 TW)
    - cron: '37 0,4 * * 1-5'
    - cron: '47 1,3 * * 1-5'
    - cron: '52 2 * * 1-5'
    - cron: '33 7 * * 1-5'

  workflow_dispatch:

jobs:
  run-strategy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests

      - name: Run Strategy Scanner
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python scanner.py
